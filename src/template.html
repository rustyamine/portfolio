<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>amine</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;700;900&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/devicons/devicon@v2.16.0/devicon.min.css" />
  <noscript><style>#intro { display: none; }</style></noscript>
</head>
<body>
  <div id="intro"><div class="intro__word" id="intro-word">amine.</div><div class="intro__count" id="intro-count">0%</div></div>
  <div class="grid-bg"></div>
  <header class="top wrap">
    <a class="logo" href="#top">amine.</a>
    <nav>
      <a href="#projects">projects</a>
      <a href="#github">github</a>
      <a href="#skills">skills</a>
      <a href="#contact">contact</a>
      <button id="theme-btn" type="button">dark mode</button>
    </nav>
  </header>

  <main id="top">
    <section class="hero wrap">
      <h1 class="big">
        <span class="line"><span class="typed">hi, i'm amine.</span></span>
        <span class="line"><span class="typed">i make websites</span></span>
        <span class="line"><span class="typed">and break linux.</span></span>
      </h1>
      <p class="sub">cs student. this is where i keep the stuff i've built.</p>
      <span class="sticker">still learning</span>
    </section>

    <div class="marquee" aria-hidden="true"><div class="marquee__track" id="marquee"></div></div>

    <section id="projects" class="wrap">
      <h2>projects</h2>
      <div class="grid" id="project-list"></div>
    </section>

    <section id="github" class="wrap">
      <h2>my github</h2>
      <p class="status" id="repo-status"></p>
      <div class="grid" id="repo-list"></div>
    </section>

    <section id="skills" class="wrap">
      <h2>what i know</h2>
      <div class="skills" id="skill-list"></div>
    </section>

    <section id="contact" class="wrap">
      <h2>find me</h2>
      <div class="links">
        <a data-link="github" target="_blank" rel="noopener">github</a>
        <a data-link="instagram" target="_blank" rel="noopener">instagram</a>
        <a data-link="linkedin" target="_blank" rel="noopener">linkedin</a>
        <a data-link="discord" target="_blank" rel="noopener">discord</a>
      </div>
    </section>
  </main>

  <footer class="wrap">&copy; 2026 amine</footer>
</body>
</html>
